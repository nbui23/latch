<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./assets/latch-mark-dark.svg" />
    <!-- 'unsafe-inline' is for the dev server only: Vite's HMR client injects CSS by
         creating <style> elements from script, which style-src governs. The built app
         loads styles.css as a plain stylesheet and needs none of it. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Latch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
